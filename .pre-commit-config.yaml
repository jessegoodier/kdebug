repos:
  - repo: local
    hooks:
      - id: prevent-protected-branch
        name: prevent direct commits and pushes to main
        entry: python3 scripts/prevent_protected_branch.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit, pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: ["--maxkb=2000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
