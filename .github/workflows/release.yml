name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.new.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"

      - name: Bump version and push release branch
        id: new
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          VERSION=$(uv version --bump "$RELEASE_TYPE" --no-sync --short)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git switch -c "release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "Release v$VERSION"
          git push origin HEAD

      - name: Merge version bump and create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.new.outputs.version }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "release/v$VERSION" \
            --title "Release v$VERSION" \
            --body "Automated release v$VERSION")
          gh pr merge "$PR_URL" --squash --delete-branch
          # A merge queue may accept the PR without merging it yet.
          COMMIT=$(gh pr view "$PR_URL" --json state,mergeCommit \
            --jq 'select(.state == "MERGED") | .mergeCommit.oid')
          if [ -z "$COMMIT" ]; then
            echo "::error::Release PR has not merged; refusing to publish."
            exit 1
          fi
          gh release create "v$VERSION" \
            --target "$COMMIT" \
            --generate-notes \
            --latest

  update-homebrew:
    needs: [release, publish-pypi]
    uses: ./.github/workflows/update-homebrew.yml
    with:
      version: v${{ needs.release.outputs.version }}
    secrets: inherit

  publish-pypi:
    needs: release
    uses: ./.github/workflows/pypi-publish.yml
    with:
      ref: v${{ needs.release.outputs.version }}
    secrets: inherit
