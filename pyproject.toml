[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kdebug"
version = "0.5.0"
description = "TUI for Kubernetes Debug Containers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Jesse Goodier" }]
keywords = ["kubernetes", "debug", "kubectl", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]

[project.scripts]
kdebug = "kdebug.cli:main"

[tool.hatch.build]
include = ["src/kdebug"]

[tool.hatch.build.targets.wheel]
packages = ["src/kdebug"]
artifacts = ["src/kdebug/completions/*"]

[tool.hatch.build.targets.sdist]
include = ["src/kdebug"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "rich>=13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[project.urls]
Homepage = "https://github.com/jessegoodier/kdebug"
Repository = "https://github.com/jessegoodier/kdebug"
